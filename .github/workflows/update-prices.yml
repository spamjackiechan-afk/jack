name: Update live prices

on:
  schedule:
    # Runs once a day at 09:00 UTC. Adjust the cron string to change timing —
    # crontab.guru is a good tool for building these if you want a different schedule.
    - cron: '0 9 * * *'
  workflow_dispatch:
    # Lets you trigger this manually from the GitHub Actions tab, to test it
    # without waiting for the schedule.

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: Run the price checker
        run: python scripts/check_prices.py

      - name: Commit updated prices if anything changed
        run: |
          git config user.name "PeptideOutpost price bot"
          git config user.email "actions@github.com"
          git add data/live_prices.json
          git diff --staged --quiet && echo "No price changes to commit." && exit 0
          git commit -m "Update live prices [automated]"

          # The price check takes several minutes, and any commit pushed to the
          # repo during that window leaves this runner behind the remote — a
          # bare `git push` is then rejected. Rebase onto whatever arrived and
          # retry. Only data/live_prices.json is touched here, and nothing else
          # writes to that file, so a rebase cannot conflict with real edits.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — pulling and retrying."
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done

          echo "Could not push after 3 attempts."
          exit 1
